<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: layout('Book due reminder', 'A book you borrowed is due soon.', ~{::content})}">
<body>
<th:block th:fragment="content">
    <div class="eyebrow" style="margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#4338ca;">Due date reminder</div>
    <h1 class="t-head h1" style="margin:0 0 16px;font-size:26px;line-height:1.25;font-weight:700;color:#0f172a;letter-spacing:-.4px;">A book is due soon</h1>

    <p class="t-body" style="margin:0 0 12px;font-size:15px;line-height:1.7;color:#475569;">
        Hi <strong class="t-head" style="color:#0f172a;" th:text="${name}">Reader</strong>,
    </p>
    <p class="t-body" style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#475569;">
        This is a friendly reminder that the following book is due for return:
    </p>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td class="panel" style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:22px 24px;">
                <div class="t-head" style="font-size:18px;line-height:1.4;font-weight:700;color:#0f172a;" th:text="${bookTitle}">Book Title</div>
                <div class="t-muted" style="margin-top:2px;font-size:14px;color:#64748b;">
                    by <span th:text="${author}">Author</span>
                </div>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:18px;">
                    <tr>
                        <td class="rule t-muted" style="border-top:1px solid #e5e7eb;padding-top:16px;font-size:13px;color:#64748b;">Due date</td>
                        <td class="rule" align="right" style="border-top:1px solid #e5e7eb;padding-top:12px;">
                            <span class="pill-red" th:text="${dueDate}"
                                  style="display:inline-block;background:#fef2f2;border:1px solid #fecaca;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;color:#b91c1c;">01 Jan 2026</span>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <th:block th:replace="~{email/components :: button(${bookLink}, 'View or renew book')}"></th:block>

    <p class="t-muted" style="margin:0;font-size:13px;line-height:1.6;color:#64748b;">
        Late returns may incur a fine. Please return or renew before the due date.
    </p>

    <th:block th:replace="~{email/components :: signoff}"></th:block>
</th:block>
</body>
</html>
